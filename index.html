<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Demo comercial de ASTREA™ Catálogo Express">
  <title>ASTREA™ · Catálogo Express Demo</title>
  <link rel="stylesheet" href="./css/app.css">
</head>

<body>
  <header class="demo-header">
    <a class="brand" href="#" aria-label="ASTREA">
      <span class="brand-mark" aria-hidden="true">A</span>
      <span>ASTREA™</span>
    </a>

    <div class="view-switcher" aria-label="Vistas de la demo">
      <button class="view-switcher__item is-active" type="button">
        Demo Catálogo Express
      </button>
      <button class="view-switcher__item" type="button" disabled>
        Admin ASTREA
      </button>
    </div>
  </header>

  <main class="page-shell">
    <section class="demo-intro" aria-labelledby="demo-title">
      <p class="eyebrow">Vertical slice · Cocina</p>
      <h1 id="demo-title">Probá el Catálogo Express</h1>
      <p>
        Buscá productos, filtrá por categoría, configurá tu pedido
        y agregalo al carrito.
      </p>
    </section>

    <div class="catalog-layout">
      <section class="catalog" aria-label="Catálogo">
        <div class="catalog-toolbar">
          <label class="search-field">
            <span class="sr-only">Buscar productos</span>
            <input
              id="search-input"
              type="search"
              placeholder="Buscar productos..."
              autocomplete="off"
            >
          </label>

          <div id="category-filter" class="category-filter" aria-label="Filtrar por categoría"></div>
        </div>

        <div id="catalog-status" class="catalog-status" aria-live="polite"></div>
        <div id="product-grid" class="product-grid"></div>
      </section>

      <aside class="cart-panel" aria-labelledby="cart-title">
        <div class="cart-panel__header">
          <div>
            <p class="eyebrow">Pedido</p>
            <h2 id="cart-title">Tu carrito</h2>
          </div>
          <span id="cart-count" class="cart-count">0</span>
        </div>

        <div id="cart-content"></div>
      </aside>
    </div>
  </main>

  <dialog id="product-dialog" class="product-dialog">
    <div id="product-detail"></div>
  </dialog>

  <footer class="site-footer">
    <span>ASTREA™</span>
    <span>Nuevas maneras de mostrarte, nuevas maneras de vender.</span>
  </footer>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
